plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = 'GeckoLib'
		url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content {
			includeGroup("software.bernie.geckolib")
			includeGroup("com.eliotlash.mclib")
		}
	}
	maven {
		name = 'Valkyrien Skies'
		url 'https://maven.valkyrienskies.org'
	}
	maven { url "https://maven.fabricmc.net/" }
	mavenCentral()
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

tasks.configureEach { task ->
	if (task.name == "runDatagen") {
		task.jvmArgs "-Dporting_lib.datagen.existing_resources=${file('src/main/resources').absolutePath}"
		task.jvmArgs "-Dfabric-api.datagen.modid=pixelpirates"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// GeckoLib (runtime + annotation processor)
	modImplementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
	annotationProcessor "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"

	// Valkyrien Skies 2
	modImplementation "org.valkyrienskies:valkyrienskies-120-fabric:${vs2_version}"

	// Kotlin stdlib — compile-only so Java can resolve VS2's Kotlin collection markers;
	// provided at runtime by VS2's bundled Kotlin runtime
	compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"


}

processResources {
	inputs.property "version", project.version
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
	// Pin the toolchain to 17: MC 1.20.1 ships LWJGL 3.3.1, which crashes natively
	// (0xC0000005, "Unsupported JNI version") when the client is launched on Java 20+.
	// JAVA_HOME may point at JDK 21 for other projects — run tasks must still use 17.
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}